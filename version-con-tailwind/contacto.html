<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Netflix</title>
  <!-- Cargo Tailwind CSS desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50"> <!-- Fondo gris claro para toda la página -->

<!-- Navbar -->
<nav class="bg-gray-900 text-white"> <!-- Barra de navegación de fondo oscuro y texto blanco -->
  <div class="container mx-auto flex items-center justify-between p-4">
    <!-- Contenedor centrado, flex para distribuir elementos, padding -->
    <a href="index.html" class="text-2xl font-bold">Netflix</a> <!-- Logo de la página -->
    <div class="space-x-4"> <!-- Espaciado entre los links -->
      <a href="productos.html" class="hover:text-gray-300">Inicio</a> <!-- Link de inicio con efecto hover -->
      <a href="#" class="font-semibold underline">Contacto</a> <!-- Link activo subrayado -->
    </div>
  </div>
</nav>

<!-- Header -->
<header class="bg-gray-100 text-center py-16">
  <!-- Fondo gris claro, texto centrado, padding vertical grande -->
  <h1 class="text-4xl font-bold mb-2">Contáctanos</h1> <!-- Título grande -->
  <p class="text-lg text-gray-700">Estamos para ayudarte con cualquier inconveniente</p> <!-- Subtítulo gris -->
</header>

<!-- Formulario -->
<section class="container mx-auto my-12 px-4">
  <!-- Contenedor centrado con margenes y padding -->
  <div class="max-w-lg mx-auto bg-white p-8 rounded shadow">
    <!-- Caja blanca con sombra, redondeada y padding -->
    <form>
      <!-- Campo Nombre -->
      <div class="mb-4">
        <label for="nombre" class="block text-gray-700 font-medium mb-2">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <!-- Input ancho completo, borde gris, redondeado y efecto al enfocarlo -->
      </div>
      
      <!-- Campo Correo -->
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Correo electrónico</label>
        <input type="email" id="email" placeholder="Tu correo" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      
      <!-- Campo Teléfono -->
      <div class="mb-4">
        <label for="telefono" class="block text-gray-700 font-medium mb-2">Teléfono</label>
        <input type="tel" id="telefono" placeholder="Tu teléfono" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      
      <!-- Campo Mensaje -->
      <div class="mb-4">
        <label for="mensaje" class="block text-gray-700 font-medium mb-2">Describe tu inconveniente</label>
        <textarea id="mensaje" rows="5" placeholder="Escribe aquí tu mensaje" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      
      <!-- Botón Enviar -->
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        Enviar
      </button>
      <!-- Botón azul con texto blanco, redondeado y cambio de color al pasar el mouse -->
    </form>
  </div>
</section>

<!-- Footer -->
<footer class="bg-gray-900 text-white text-center py-4">
  &copy; 2025 Mi Sitio - Todos los derechos reservados
</footer>

</body>
</html>
