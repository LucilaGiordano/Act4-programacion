<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto - Netflix</title>
  <!-- Cargo Bootstrap CSS desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <!-- Barra de navegación oscura -->
  <div class="container">
    <a class="navbar-brand" href="index.html">Netflix</a> <!-- Logo -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span> <!-- Botón hamburguesa en móvil -->
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <!-- ms-auto empuja los links a la derecha -->
        <li class="nav-item"><a class="nav-link" href="productos.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Contacto</a></li>
        <!-- Link activo resaltado -->
      </ul>
    </div>
  </div>
</nav>

<!-- Header -->
<header class="bg-light text-center p-5">
  <!-- Fondo claro, texto centrado, padding grande -->
  <h1 class="display-4">Contáctanos</h1> <!-- Título grande estilo Bootstrap -->
  <p class="lead">Estamos para ayudarte con cualquier inconveniente</p> <!-- Subtítulo -->
</header>

<!-- Formulario -->
<section class="container my-5">
  <!-- Contenedor central con márgenes verticales -->
  <div class="row justify-content-center">
    <!-- Fila con contenido centrado -->
    <div class="col-md-8">
      <form>
        <!-- Campo Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
          <!-- Input ancho completo con estilo Bootstrap -->
        </div>
        
        <!-- Campo Correo -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="Tu correo">
        </div>
        
        <!-- Campo Teléfono -->
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="telefono" placeholder="Tu teléfono">
        </div>
        
        <!-- Campo Mensaje -->
        <div class="mb-3">
          <label for="mensaje" class="form-label">Describe tu inconveniente</label>
          <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe aquí tu mensaje"></textarea>
        </div>
        
        <!-- Botón Enviar -->
        <button type="submit" class="btn btn-primary">Enviar</button>
        <!-- Botón azul estilo Bootstrap -->
      </form>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  &copy; 2025 Mi Sitio - Todos los derechos reservados
</footer>

<!-- Scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
